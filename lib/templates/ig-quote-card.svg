<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" data-preset="ig-square" data-template="ig-quote-card">
  <g id="bg-field" data-h="stretch" data-v="stretch">
    <rect x="-12" y="-12" width="1104" height="1104" fill="#141726"/>
  </g>

  <g id="quote-mark" data-h="left" data-v="top">
    <circle cx="112" cy="268" r="54" fill="#F5C542"/>
    <path d="M112 214 L196 130 L196 214 Z" fill="#F5C542"/>
    <circle cx="248" cy="268" r="54" fill="#F5C542"/>
    <path d="M248 214 L332 130 L332 214 Z" fill="#F5C542"/>
  </g>

  <g id="quote-text" data-h="left" data-v="center" data-fit="shrink" data-box="64 380 952 292">
    <text x="64" y="456" font-family="Playfair Display" font-size="88" font-weight="700" letter-spacing="-1.5" fill="#FFFFFF"><tspan x="64" dy="0">Design that</tspan><tspan x="64" dy="96">stays yours</tspan><tspan x="64" dy="96">after the AI.</tspan></text>
  </g>

  <g id="attribution" data-h="left" data-v="bottom" data-box="64 700 620 150">
    <rect x="64" y="712" width="80" height="5" fill="#F5C542"/>
    <text x="64" y="786" font-family="Source Serif 4" font-size="32" font-weight="600" fill="#F5C542">Sarah Mitchell</text>
    <text x="64" y="830" font-family="Source Serif 4" font-size="24" font-weight="400" fill="#FFFFFF" opacity="0.7">Head of Brand, Northwind</text>
  </g>

  <g id="brand-mark" data-h="right" data-v="bottom" data-box="596 940 420 56">
    <text x="1016" y="980" text-anchor="end" font-family="Source Serif 4" font-size="24" font-weight="600" fill="#FFFFFF" opacity="0.55">northwind.co</text>
  </g>

  <g id="accent-band" data-h="stretch" data-v="bottom">
    <rect x="0" y="1040" width="1080" height="40" fill="#F5C542"/>
  </g>
</svg>
