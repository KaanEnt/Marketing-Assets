<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-preset="yt-thumb" data-template="yt-big-number">
  <defs>
    <linearGradient id="number-scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08090C" stop-opacity="0.94"/>
      <stop offset="0.62" stop-color="#08090C" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#08090C" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <g id="bg-photo" data-h="stretch" data-v="stretch" data-slot="image" data-prompt="wide photograph of a cluttered developer desk at night, screens glowing, shot from a low angle">
    <rect x="0" y="0" width="1280" height="720" fill="#2A2E36"/>
  </g>

  <g id="scrim" data-h="stretch" data-v="stretch">
    <rect x="0" y="0" width="1280" height="720" fill="url(#number-scrim)"/>
  </g>

  <g id="kicker" data-h="left" data-v="top" data-box="64 76 600 48">
    <text x="64" y="112" font-family="Archivo" font-size="28" font-weight="700" letter-spacing="4" fill="#FFD400">DEV LOG &#183; EP 12</text>
  </g>

  <g id="big-numeral" data-h="left" data-v="center" data-fit="shrink" data-box="64 220 240 320">
    <text x="64" y="520" font-family="Archivo" font-size="340" font-weight="800" letter-spacing="-12" fill="#FFD400">7</text>
  </g>

  <g id="headline" data-h="left" data-v="center" data-fit="shrink" data-box="320 268 781 280">
    <text x="320" y="380" font-family="Archivo" font-size="118" font-weight="800" letter-spacing="-4" fill="#FFFFFF"><tspan x="320" dy="0">THINGS I</tspan><tspan x="320" dy="120">GOT WRONG</tspan></text>
  </g>

  <g id="brand-tag" data-h="left" data-v="bottom" data-box="64 604 480 56">
    <text x="64" y="644" font-family="Inter" font-size="30" font-weight="600" fill="#FFFFFF" opacity="0.75">@northwind</text>
  </g>
</svg>
