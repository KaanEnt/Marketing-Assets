<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" data-preset="us-letter" data-template="bold-flat-arc">
  <defs>
    <pattern id="tpl-stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="6" height="14" fill="#F4531C"/>
    </pattern>
    <clipPath id="tpl-disc-a"><circle cx="742" cy="132" r="88"/></clipPath>
    <clipPath id="tpl-disc-b"><circle cx="132" cy="880" r="88"/></clipPath>
    <clipPath id="tpl-photo-clip">
      <path d="M862 470 a392 392 0 0 0 -392 392 v250 h392 Z"/>
    </clipPath>
  </defs>

  <g id="bg-wash" data-h="stretch" data-v="stretch">
    <rect x="-12" y="-12" width="874" height="1124" fill="#1273F0"/>
  </g>

  <g id="accent-discs" data-h="scale" data-v="scale">
    <g clip-path="url(#tpl-disc-a)"><rect x="654" y="44" width="176" height="176" fill="url(#tpl-stripes)"/></g>
    <g clip-path="url(#tpl-disc-b)"><rect x="44" y="792" width="176" height="176" fill="url(#tpl-stripes)"/></g>
  </g>

  <g id="photo-slot" data-h="right" data-v="bottom" data-slot="image" data-prompt="lifestyle photograph of a person in the subject setting, natural light">
    <path d="M862 470 a392 392 0 0 0 -392 392 v250 h392 Z" fill="#E8ECEE"/>
  </g>

  <g id="headline" data-h="left" data-v="top" data-fit="shrink" data-box="56 74 640 230">
    <text x="56" y="152" font-family="Inter Tight" font-size="76" font-weight="800" letter-spacing="-2" fill="#FFFFFF"><tspan x="56" dy="0">The Best</tspan><tspan x="56" dy="82">Insurance for</tspan><tspan x="56" dy="82">All Travelers</tspan></text>
  </g>

  <g id="hero-art" data-h="stretch" data-v="center" data-slot="illustration" data-prompt="flat vector airplane in three-quarter view, orange and cream, no background">
    <rect x="46" y="316" width="758" height="268" fill="none"/>
  </g>

  <g id="brand-block" data-h="left" data-v="center" data-box="56 592 300 110">
    <text x="56" y="626" font-family="Inter Tight" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF"><tspan x="56" dy="0">Globehop</tspan><tspan x="56" dy="40">Insurance</tspan></text>
    <text x="56" y="706" font-family="Inter" font-size="21" font-weight="400" fill="#FFFFFF">globehopinsurance.com</text>
  </g>
</svg>
